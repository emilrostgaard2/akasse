name: Upload akassematch.dk til Simply

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      kun_test:
        description: "Kør uden at uploade (dry-run)"
        type: boolean
        default: false

concurrency:
  group: deploy-akassematch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byg siderne
        run: |
          if [ -f _build/build.py ]; then
            python3 _build/build.py
          else
            echo "Ingen _build/build.py endnu – springer bygning over."
          fi

      - name: Validér
        run: |
          if [ -f _build/validate.py ]; then
            python3 _build/validate.py
          else
            echo "Ingen _build/validate.py endnu – springer validering over."
          fi

      - name: Upload med lftp
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          BRUGER: ${{ secrets.FTP_USERNAME }}
          KODE: ${{ secrets.FTP_PASSWORD }}
          MAALMAPPE: ${{ vars.FTP_TARGET_DIR || 'public_html' }}
          TESTKOERSEL: ${{ inputs.kun_test && '--dry-run' || '' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-allow true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 30;
            open -u '$BRUGER','$KODE' '$SERVER';
            mirror --reverse --only-newer --parallel=2 $TESTKOERSEL \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob _build/ \
              --exclude-glob .gitignore \
              --exclude-glob '*.md' \
              ./ $MAALMAPPE/;
          "
